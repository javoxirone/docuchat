
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuchat-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - documents_storage:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuchat-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    volumes:
      - .:/app
      - documents_storage:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
  makemigrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuchat-makemigrations
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "revision", "--autogenerate", "-m", "Auto-generated migration"]
    volumes:
      - .:/app
      - documents_storage:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    container_name: docuchat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  documents_storage:
